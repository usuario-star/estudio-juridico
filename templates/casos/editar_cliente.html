    {% extends "casos/base.html" %}

{% block contenido %}
<h2>Editar Cliente</h2>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<form method="post">
    {% csrf_token %}
    <p>
        <label for="nombres"><strong>Nombres:</strong></label><br>
        <input type="text" name="nombres" id="nombres" value="{{ cliente.nombres }}" required
               style="width:100%; padding:0.5rem; margin-top:0.25rem; border:1px solid #ccc; border-radius:4px;">
    </p>
    <p>
        <label for="documento"><strong>Documento (DNI / RUC):</strong></label><br>
        <input type="text" name="documento" id="documento" value="{{ cliente.documento }}" required
               style="width:100%; padding:0.5rem; margin-top:0.25rem; border:1px solid #ccc; border-radius:4px;">
    </p>
    <p>
        <label for="telefono"><strong>Teléfono:</strong></label><br>
        <input type="text" name="telefono" id="telefono" value="{{ cliente.telefono }}" required
               style="width:100%; padding:0.5rem; margin-top:0.25rem; border:1px solid #ccc; border-radius:4px;">
    </p>
    <p>
        <label for="correo"><strong>Correo:</strong></label><br>
        <input type="email" name="correo" id="correo" value="{{ cliente.correo }}" required
               style="width:100%; padding:0.5rem; margin-top:0.25rem; border:1px solid #ccc; border-radius:4px;">
    </p>
    <p>
        <button type="submit" class="btn btn-success">Guardar Cambios</button>
        <a href="{% url 'lista_clientes' %}" class="btn btn-default">Cancelar</a>
    </p>
</form>
{% endblock %}
